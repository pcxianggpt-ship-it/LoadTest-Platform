server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:jmeter-influx.yml
      - optional:file:./config/jmeter-influx.yml
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/loadtest-platform.db
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

loadtest:
  grafana:
    image-dir: ./data/grafana-images
