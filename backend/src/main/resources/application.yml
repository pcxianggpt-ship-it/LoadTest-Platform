server:
  port: 8080

spring:
  web:
    resources:
      static-locations:
        - file:${LOADTEST_FRONTEND_DIR:../frontend}/
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
  config:
    import:
      - optional:classpath:jmeter-influx.yml
      - optional:file:./config/jmeter-influx.yml
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/loadtest-platform.db
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

loadtest:
  grafana:
    image-dir: ./data/grafana-images
